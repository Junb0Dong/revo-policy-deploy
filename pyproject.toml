[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "revo-policy-deploy"
version = "0.1.0"
description = "Portable ACT policy runtime and framed-stdio inferencer for Revo robots"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "lerobot==0.6.2",
    "numpy>=2.0.0,<2.3.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
revo-policy-inferencer = "revo_policy_deploy.deploy.policy_inferencer:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
lerobot = { path = "vendor/lerobot-0.6.2-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
